info:
  name: Get Liveness Challenge List
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/liveness-challenge"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{faculty_token}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
