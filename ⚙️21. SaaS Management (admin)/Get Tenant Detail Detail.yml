info:
  name: Get Tenant Detail Detail
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/saas/colleges/:pk/"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{jwtToken}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
      disabled: true
  params:
    - name: pk
      value: "1"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
