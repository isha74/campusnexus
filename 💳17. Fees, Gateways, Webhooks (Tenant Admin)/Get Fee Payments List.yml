info:
  name: Get Fee Payments List
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/fees/payments"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{admin_token}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Example Response
    request:
      url: "{{baseUrl}}/fees/payments"
      method: GET
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: Bearer {{admin_token}}
        - name: X-Tenant-Schema
          value: "{{schema}}"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": 100,
              "invoice_id": 1,
              "amount_paid": "45000.00",
              "payment_mode": "cash",
              "timestamp": "2026-07-08T14:00:00Z"
            }
          ]
