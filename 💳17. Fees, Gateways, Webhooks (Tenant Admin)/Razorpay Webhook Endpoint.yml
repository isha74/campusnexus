info:
  name: Razorpay Webhook Endpoint
  type: http
  seq: 13

http:
  method: POST
  url: "{{baseUrl}}/payments/webhook/razorpay"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{jwtToken}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
  body:
    type: json
    data: |-
      {
        "event": "order.paid",
        "payload": {
          "payment": {
            "entity": {
              "order_id": "order_Fh9a8S72f",
              "amount": 4500000
            }
          }
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Example Response
    request:
      url: "{{baseUrl}}/payments/webhook/razorpay"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: Bearer {{jwtToken}}
        - name: X-Tenant-Schema
          value: "{{schema}}"
      body:
        type: json
        data: |-
          {
            "event": "order.paid",
            "payload": {
              "payment": {
                "entity": {
                  "order_id": "order_Fh9a8S72f",
                  "amount": 4500000
                }
              }
            }
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Webhook processed."
          }
