info:
  name: Bulk Generate Invoices
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/fees/invoices/bulk-generate"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{jwtToken}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
  body:
    type: json
    data: |-
      {
        "structure_id": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
