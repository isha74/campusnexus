info:
  name: Create Inventory Items
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/inventory-items/"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{admin_token}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
  body:
    type: json
    data: |
      {
        "category": 1,
        "name": "Arduino Uno R3 Starter Kit",
        "quantity": 50,
        "unit": "boxes",
        "threshold_level": 10
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Example Response
    request:
      url: "{{baseUrl}}/inventory-items/"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: Bearer {{admin_token}}
        - name: X-Tenant-Schema
          value: "{{schema}}"
      body:
        type: json
        data: |
          {
            "category": 1,
            "name": "Arduino Uno R3 Starter Kit",
            "quantity": 50,
            "unit": "boxes",
            "threshold_level": 10
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "category_id": 1,
            "name": "Arduino Uno",
            "total_stock": 50
          }
