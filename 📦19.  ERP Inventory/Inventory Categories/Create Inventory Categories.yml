info:
  name: Create Inventory Categories
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/inventory-categories/"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{admin_token}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
  body:
    type: json
    data: |
      {
        "name": "Lab Electronics & Hardware",
        "description": "Microcontrollers, Sensors, Raspberry Pis, and Lab Cables"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Example Response
    request:
      url: "{{baseUrl}}/inventory-categories/"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: Bearer {{admin_token}}
        - name: X-Tenant-Schema
          value: "{{schema}}"
      body:
        type: json
        data: |
          {
            "name": "Lab Electronics & Hardware",
            "description": "Microcontrollers, Sensors, Raspberry Pis, and Lab Cables"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "name": "Electronics"
          }
