info:
  name: Get Lectures List/Create
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/lectures"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{jwtToken}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Example Response
    request:
      url: "{{baseUrl}}/lectures"
      method: GET
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: Bearer {{jwtToken}}
        - name: X-Tenant-Schema
          value: "{{schema}}"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": 1,
              "classroom": 1,
              "topic": "Intro to AI",
              "scheduled_time": "2026-07-08T10:00:00Z"
            }
          ]
