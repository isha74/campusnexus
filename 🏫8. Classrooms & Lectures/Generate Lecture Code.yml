info:
  name: Generate Lecture Code
  type: http
  seq: 11

http:
  method: POST
  url: "{{baseUrl}}/api/lectures/1/generate-code/"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{admin_token}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
  body:
    type: json
    data: |
      {
        "latitude": 18.5204,
        "longitude": 73.8567
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Example Response
    request:
      url: "{{baseUrl}}/api/lectures/1/generate-code/"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: Bearer {{admin_token}}
        - name: X-Tenant-Schema
          value: "{{schema}}"
      body:
        type: json
        data: |
          {
            "latitude": 18.5204,
            "longitude": 73.8567
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
