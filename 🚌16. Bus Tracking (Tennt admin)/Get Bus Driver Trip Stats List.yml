info:
  name: Get Bus Driver Trip Stats List
  type: http
  seq: 23

http:
  method: GET
  url: "{{baseUrl}}/bus/driver/trip-stats/"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{admin_token}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
