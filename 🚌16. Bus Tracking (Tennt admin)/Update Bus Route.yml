info:
  name: Update Bus Route
  type: http
  seq: 14

http:
  method: PUT
  url: "{{baseUrl}}/bus/routes/:pk/"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{admin_token}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
  params:
    - name: pk
      value: "1"
      type: path
  body:
    type: json
    data: "{\r

      \  \"name\": \"North Route - Gate 1 (Morning Shift)\"\r

      }\r\n"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
