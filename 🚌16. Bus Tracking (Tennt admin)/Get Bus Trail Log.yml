info:
  name: Get Bus Trail Log
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/bus/trail/3/"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{admin_token}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Example Response
    request:
      url: "{{baseUrl}}/bus/trail/3/"
      method: GET
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: Bearer {{admin_token}}
        - name: X-Tenant-Schema
          value: "{{schema}}"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "driver_id": "3",
            "trail": [
              [
                12.9716,
                77.5946
              ],
              [
                12.9718,
                77.5948
              ]
            ],
            "distance_km": 0.03
          }
