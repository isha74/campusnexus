info:
  name: Get Live Bus Locations
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/bus/live/"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{admin_token}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Example Response
    request:
      url: "{{baseUrl}}/bus/live/"
      method: GET
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: Bearer {{admin_token}}
        - name: X-Tenant-Schema
          value: "{{schema}}"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "driver_id": 3,
              "driver_name": "Driver Raj",
              "route_name": "North Route",
              "lat": 12.9718,
              "lng": 77.5948
            }
          ]
