info:
  name: Get My Leave Requests History
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/leave/my/"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{faculty_token}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Example Response
    request:
      url: "{{baseUrl}}/leave/my/"
      method: GET
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: Bearer {{faculty_token}}
        - name: X-Tenant-Schema
          value: "{{schema}}"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": 2,
              "start_date": "2026-06-01",
              "end_date": "2026-06-02",
              "status": "approved"
            }
          ]
