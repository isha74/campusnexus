info:
  name: Get Leave Requests (Approval List)
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/leave/requests/"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{faculty_token}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Example Response
    request:
      url: "{{baseUrl}}/leave/requests/"
      method: GET
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: Bearer {{faculty_token}}
        - name: X-Tenant-Schema
          value: "{{schema}}"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": 1,
              "employee_name": "Jane Smith",
              "leave_type": "Casual Leave",
              "days": 2,
              "status": "pending"
            }
          ]
