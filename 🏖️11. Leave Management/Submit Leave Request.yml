info:
  name: Submit Leave Request
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/leave/request/"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{faculty_token}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
  body:
    type: json
    data: |
      {
        "leave_type_id": 1,
        "start_date": "2026-10-20",
        "end_date": "2026-10-22",
        "reason": "Attending IEEE Research Conference."
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Example Response
    request:
      url: "{{baseUrl}}/leave/request/"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: Bearer {{faculty_token}}
        - name: X-Tenant-Schema
          value: "{{schema}}"
      body:
        type: json
        data: |
          {
            "leave_type_id": 1,
            "start_date": "2026-10-20",
            "end_date": "2026-10-22",
            "reason": "Attending IEEE Research Conference."
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Leave request submitted successfully."
          }
