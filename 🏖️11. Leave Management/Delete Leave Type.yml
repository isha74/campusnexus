info:
  name: Delete Leave Type
  type: http
  seq: 9

http:
  method: DELETE
  url: "{{baseUrl}}/leave/types/:pk/"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{admin_token}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
  params:
    - name: pk
      value: "1"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
