info:
  name: Guardian Consent Approval
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/register/guardian-consent"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{jwtToken}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
  body:
    type: json
    data: |-
      {
        "email": "minor@test.com",
        "student_id": "STU995",
        "guardian_email": "janedoe@test.com",
        "action": "approve"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Example Response
    request:
      url: "{{baseUrl}}/register/guardian-consent"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: Bearer {{jwtToken}}
        - name: X-Tenant-Schema
          value: "{{schema}}"
      body:
        type: json
        data: |-
          {
            "email": "minor@test.com",
            "student_id": "STU995",
            "guardian_email": "janedoe@test.com",
            "action": "approve"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Guardian consent approved. Student profile is now active."
          }
