info:
  name: Get Assignments List/Create
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/assignments"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{faculty_token}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

