info:
  name: Get Assignment Submissions List
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/assignments/1/submissions"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{faculty_token}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Example Response
    request:
      url: "{{baseUrl}}/assignments/1/submissions"
      method: GET
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: Bearer {{faculty_token}}
        - name: X-Tenant-Schema
          value: "{{schema}}"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": 12,
              "student_name": "Demo Student",
              "submitted_file": "resnet_code.zip",
              "grade": null
            }
          ]
