info:
  name: Submit Assignment Solution
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/assignments/1/submissions/"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{student_token}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
  body:
    type: json
    data: |
      {
        "text_submission": "class Node:\n    def __init__(self, key):\n        self.left = None\n        self.right = None\n        self.val = key\n\n# BST insertion and traversal completed."
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Example Response
    request:
      url: "{{baseUrl}}/assignments/1/submissions/"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: Bearer {{student_token}}
        - name: X-Tenant-Schema
          value: "{{schema}}"
      body:
        type: json
        data: |
          {
            "text_submission": "class Node:\n    def __init__(self, key):\n        self.left = None\n        self.right = None\n        self.val = key\n\n# BST insertion and traversal completed."
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": 12,
            "message": "Assignment submitted successfully."
          }
