info:
  name: Approve Device Reset
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/lecturer/approve-device-reset"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{jwtToken}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
  body:
    type: json
    data: |-
      {
        "request_id": 2,
        "action": "approve"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Example Response
    request:
      url: "{{baseUrl}}/lecturer/approve-device-reset"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: Bearer {{jwtToken}}
        - name: X-Tenant-Schema
          value: "{{schema}}"
      body:
        type: json
        data: |-
          {
            "request_id": 2,
            "action": "approve"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Device reset action completed."
          }
