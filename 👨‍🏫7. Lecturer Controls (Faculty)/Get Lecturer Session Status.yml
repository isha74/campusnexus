info:
  name: Get Lecturer Session Status
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/lecturer/status/?lecture_id={{lecture_id}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{faculty_token}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
  params:
    - name: lecture_id
      value: "{{lecture_id}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Example Response
    request:
      url: "{{baseUrl}}/lecturer/status/?lecture_id={{lecture_id}}"
      method: GET
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: Bearer {{faculty_token}}
        - name: X-Tenant-Schema
          value: "{{schema}}"
      params:
        - name: lecture_id
          value: "{{lecture_id}}"
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "session_active": true,
            "code": "XYZ9",
            "enrolled": 40,
            "present": 12
          }
