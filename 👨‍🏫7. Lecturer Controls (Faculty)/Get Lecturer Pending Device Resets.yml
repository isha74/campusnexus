info:
  name: Get Lecturer Pending Device Resets
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/lecturer/device-resets"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{jwtToken}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Example Response
    request:
      url: "{{baseUrl}}/lecturer/device-resets"
      method: GET
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: Bearer {{jwtToken}}
        - name: X-Tenant-Schema
          value: "{{schema}}"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": 2,
              "student_name": "John Doe",
              "reason": "Lost old phone"
            }
          ]
