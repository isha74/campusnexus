info:
  name: Create Department
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/department/"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{admin_token}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
  body:
    type: json
    data: |-
      {
        "name": "Computer Science & Engineering Department",
        "code": "CSED",
        "email": "csed@campusnexus.in",
        "description": "Department of Computer Science & Engineering"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Example Response
    request:
      url: "{{baseUrl}}/api/department/"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: Bearer {{admin_token}}
        - name: X-Tenant-Schema
          value: "{{schema}}"
      body:
        type: json
        data: |-
          {
            "name": "Computer Science & Engineering Department",
            "code": "CSED",
            "email": "csed@campusnexus.in",
            "description": "Department of Computer Science & Engineering"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": 2,
            "name": "Civil Engineering",
            "code": "CE"
          }
