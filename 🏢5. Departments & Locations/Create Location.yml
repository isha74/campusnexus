info:
  name: Create Location
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/location"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{jwtToken}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
  body:
    type: json
    data: |-
      {
        "name": "Block B Lecture Hall 2",
        "latitude": 12.972,
        "longitude": 77.595,
        "radius_meters": 30.0
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Example Response
    request:
      url: "{{baseUrl}}/location"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: Bearer {{jwtToken}}
        - name: X-Tenant-Schema
          value: "{{schema}}"
      body:
        type: json
        data: |-
          {
            "name": "Block B Lecture Hall 2",
            "latitude": 12.972,
            "longitude": 77.595,
            "radius_meters": 30.0
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": 2,
            "name": "Block B Lecture Hall 2",
            "latitude": 12.972,
            "longitude": 77.595
          }
