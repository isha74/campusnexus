info:
  name: Get Locations List
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/location"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{jwtToken}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Example Response
    request:
      url: "{{baseUrl}}/location"
      method: GET
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: Bearer {{jwtToken}}
        - name: X-Tenant-Schema
          value: "{{schema}}"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": 1,
              "name": "Block A Main Hall",
              "latitude": 12.9716,
              "longitude": 77.5946,
              "radius_meters": 50.0
            }
          ]
