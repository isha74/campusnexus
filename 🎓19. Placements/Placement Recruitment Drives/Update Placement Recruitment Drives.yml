info:
  name: Update Placement Recruitment Drives
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/recruitment-drives/1"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{jwtToken}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
  body:
    type: json
    data: |-
      {
        "job_role": "Senior Software Engineer"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

