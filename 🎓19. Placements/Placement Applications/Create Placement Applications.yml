info:
  name: Create Placement Applications
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/placement-applications/"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{admin_token}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
  body:
    type: json
    data: |-
      {
        "student": 1,
        "drive": 1,
        "status": "Applied",
        "remarks": "Submitted resume and GitHub portfolio"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Example Response
    request:
      url: "{{baseUrl}}/placement-applications/"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: Bearer {{admin_token}}
        - name: X-Tenant-Schema
          value: "{{schema}}"
      body:
        type: json
        data: |-
          {
            "student": 1,
            "drive": 1,
            "status": "Applied",
            "remarks": "Submitted resume and GitHub portfolio"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "drive_id": 1,
            "student_profile_id": 1
          }
