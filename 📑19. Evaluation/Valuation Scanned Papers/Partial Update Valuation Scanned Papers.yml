info:
  name: Partial Update Valuation Scanned Papers
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{baseUrl}}/scanned-papers/1/"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{admin_token}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
  body:
    type: json
    data: |
      {
        "allocated_marks": "46.50",
        "question_scores": {
          "Q1": 18.0,
          "Q2": 15.0,
          "Q3": 13.5
        },
        "status": "Evaluated",
        "remarks": "Excellent code implementation and AVL balancing."
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

