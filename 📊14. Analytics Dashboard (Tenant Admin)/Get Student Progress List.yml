info:
  name: Get Student Progress List
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/analytics/student-progress?student_id={{student_id}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{admin_token}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
  params:
    - name: student_id
      value: "{{student_id}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
