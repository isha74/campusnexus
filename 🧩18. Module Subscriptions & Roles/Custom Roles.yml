info:
  name: Custom Roles
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/tenant/roles/"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{jwtToken}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
  body:
    type: json
    data: "{\r

      \  \"role_name\": \"Lab Assistant\"\r

      }\r\n"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
