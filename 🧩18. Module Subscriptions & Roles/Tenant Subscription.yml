info:
  name: Tenant Subscription
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/tenant/subscriptions/:tenant_id"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{jwtToken}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
  params:
    - name: tenant_id
      value: "1"
      type: path
      description: The tenant_id parameter
  body:
    type: json
    data: "{}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
