info:
  name: Update Teaching Staff User Profile
  type: http
  seq: 15

http:
  method: PUT
  url: "{{baseUrl}}/teaching-staff/user"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{jwtToken}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
  body:
    type: json
    data: "{}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
