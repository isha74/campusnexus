info:
  name: Partial Update Active Tenant Settings
  type: http
  seq: 10

http:
  method: PATCH
  url: "{{baseUrl}}/tenant/settings"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{jwtToken}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
  body:
    type: json
    data: "{}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
