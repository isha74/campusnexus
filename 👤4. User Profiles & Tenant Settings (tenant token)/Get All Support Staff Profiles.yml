info:
  name: Get All Support Staff Profiles
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/support-staff/user"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{admin_token}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
  params:
    - name: search
      value: John
      type: query
      disabled: true
    - name: page
      value: "1"
      type: query
      disabled: true
    - name: page_size
      value: "10"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Example Response
    request:
      url: "{{baseUrl}}/support-staff/user"
      method: GET
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: Bearer {{admin_token}}
        - name: X-Tenant-Schema
          value: "{{schema}}"
      params:
        - name: search
          value: John
          type: query
          disabled: true
        - name: page
          value: "1"
          type: query
          disabled: true
        - name: page_size
          value: "10"
          type: query
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
