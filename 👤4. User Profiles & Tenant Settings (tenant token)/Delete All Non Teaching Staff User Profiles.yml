info:
  name: Delete All Non Teaching Staff User Profiles
  type: http
  seq: 20

http:
  method: DELETE
  url: "{{baseUrl}}/support-staff/user"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{jwtToken}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
