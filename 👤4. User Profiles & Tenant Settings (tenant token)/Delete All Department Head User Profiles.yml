info:
  name: Delete All Department Head User Profiles
  type: http
  seq: 18

http:
  method: DELETE
  url: "{{baseUrl}}/hod/user"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{jwtToken}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
