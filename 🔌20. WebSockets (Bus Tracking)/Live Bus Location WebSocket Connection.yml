info:
  name: Live Bus Location WebSocket Connection
  type: http
  seq: 1

http:
  method: GET
  url: ws:..{{baseUrl}}/ws/bus-tracking?token={{jwtToken}}&schema={{schema}}
  params:
    - name: token
      value: "{{jwtToken}}"
      type: query
    - name: schema
      value: "{{schema}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Establish a real-time WebSocket connection to track/stream live bus geolocations.

  Connection URL: ws://{{baseUrl}}/ws/bus-tracking/?token={{jwtToken}}&schema={{schema}}
