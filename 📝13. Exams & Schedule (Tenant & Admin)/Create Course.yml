info:
  name: Create Course
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/courses/"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{admin_token}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
  body:
    type: json
    data: |
      {
        "course_code": "CS101",
        "course_name": "Data Structures & Algorithms",
        "department_id": 1,
        "credits": 4,
        "semester_number": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Example Response
    request:
      url: "{{baseUrl}}/api/courses/"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: Bearer {{admin_token}}
        - name: X-Tenant-Schema
          value: "{{schema}}"
      body:
        type: json
        data: |
          {
            "course_code": "CS101",
            "course_name": "Data Structures & Algorithms",
            "department_id": 1,
            "credits": 4,
            "semester_number": 1
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": 1,
            "name": "Linear Algebra",
            "code": "MATH201"
          }
