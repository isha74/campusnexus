info:
  name: Get Exam Detail
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/exams/:pk"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{jwtToken}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
  params:
    - name: pk
      value: "1"
      type: path
      description: The pk parameter
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
