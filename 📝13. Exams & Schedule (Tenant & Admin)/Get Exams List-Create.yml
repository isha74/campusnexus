info:
  name: Get Exams List/Create
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/exams"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{jwtToken}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Example Response
    request:
      url: "{{baseUrl}}/exams"
      method: GET
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: Bearer {{jwtToken}}
        - name: X-Tenant-Schema
          value: "{{schema}}"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": 1,
              "title": "Calculus Midterm",
              "exam_type": 1,
              "date": "2026-07-20"
            }
          ]
