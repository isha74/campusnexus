info:
  name: User Permissions
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/college/user-permissions/:user_id"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{admin_token}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
  params:
    - name: user_id
      value: "2"
      type: path
      description: The user_id parameter
  body:
    type: json
    data: "{\r

      \  \"permissions\": [\r

      \    \"add_lecture\",\r

      \    \"change_lecture\",\r

      \    \"add_attendance\",\r

      \    \"change_attendance\",\r

      \    \"add_assignment\",\r

      \    \"change_assignment\"\r

      \  ]\r

      }\r\n"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
