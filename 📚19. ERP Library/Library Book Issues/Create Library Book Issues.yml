info:
  name: Create Library Book Issues
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/book-issues/"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{admin_token}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
  body:
    type: json
    data: |
      {
        "book_copy": 1,
        "student": 1,
        "due_date": "2026-10-30",
        "status": "Issued"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Example Response
    request:
      url: "{{baseUrl}}/book-issues/"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: Bearer {{admin_token}}
        - name: X-Tenant-Schema
          value: "{{schema}}"
      body:
        type: json
        data: |
          {
            "book_copy": 1,
            "student": 1,
            "due_date": "2026-10-30",
            "status": "Issued"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "book_copy_id": 1,
            "student_profile_id": 1,
            "due_date": "2026-07-22"
          }
