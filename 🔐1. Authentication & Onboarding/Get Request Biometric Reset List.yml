info:
  name: Get Request Biometric Reset List
  type: http
  seq: 19

http:
  method: GET
  url: "{{baseUrl}}/student/request-biometric-reset"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{jwtToken}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
