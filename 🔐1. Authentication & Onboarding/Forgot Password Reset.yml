info:
  name: Forgot Password Reset
  type: http
  seq: 18

http:
  method: POST
  url: "{{baseUrl}}/user/forgot-password/reset"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{jwtToken}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
  body:
    type: json
    data: |-
      {
        "email": "user@college.edu.in",
        "password": "NewSecurePassword123!",
        "password_confirm": "NewSecurePassword123!"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
