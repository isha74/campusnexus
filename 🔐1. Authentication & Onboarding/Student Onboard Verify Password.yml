info:
  name: Student Onboard Verify Password
  type: http
  seq: 15

http:
  method: POST
  url: "{{baseUrl}}/student/onboard/verify-password"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{jwtToken}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
  body:
    type: json
    data: |-
      {
        "email": "student@college.edu.in",
        "password": "SecurePassword123!"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
