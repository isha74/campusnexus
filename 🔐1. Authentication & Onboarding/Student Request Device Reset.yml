info:
  name: Student Request Device Reset
  type: http
  seq: 11

http:
  method: POST
  url: "{{baseUrl}}/student/reset-device-lock"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{jwtToken}}
    - name: X-Tenant-Schema
      value: "{{schema}}"
  body:
    type: json
    data: |-
      {
        "student_id": "STU123",
        "reason": "Upgraded to a new phone."
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Example Response
    request:
      url: "{{baseUrl}}/student/reset-device-lock"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: Bearer {{jwtToken}}
        - name: X-Tenant-Schema
          value: "{{schema}}"
      body:
        type: json
        data: |-
          {
            "student_id": "STU123",
            "reason": "Upgraded to a new phone."
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Device reset request submitted successfully."
          }
